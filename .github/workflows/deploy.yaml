name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────
  # JOB 1: Build & push Docker image
  # ─────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "value=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/roadmap-ai:latest
            ${{ secrets.DOCKER_USERNAME }}/roadmap-ai:sha-${{ steps.sha.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────
  # JOB 2: Deploy to EC2 over SSH
  # ─────────────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Log in to Docker Hub
            echo "${{ secrets.DOCKER_TOKEN }}" | \
              docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Pull the new image
            docker pull ${{ secrets.DOCKER_USERNAME }}/roadmap-ai:latest

            # Stop & remove old container if it exists
            docker stop roadmap-ai || true
            docker rm roadmap-ai || true

            # Run the new container
            docker run -d \
              --name roadmap-ai \
              --restart unless-stopped \
              -p 80:3000 \
              -e TURSO_DATABASE_URL="${{ secrets.TURSO_DATABASE_URL }}" \
              -e TURSO_AUTH_TOKEN="${{ secrets.TURSO_AUTH_TOKEN }}" \
              -e AUTH_SECRET="${{ secrets.AUTH_SECRET }}" \
              -e NODE_ENV=production \
              ${{ secrets.DOCKER_USERNAME }}/roadmap-ai:latest

            # Clean up old images
            docker image prune -f

            echo "✅ Deployed sha-${{ needs.build-and-push.outputs.short_sha }}"
